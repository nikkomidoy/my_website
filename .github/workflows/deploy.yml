name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must serialize, not race on the same host.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # The gate: red tests never reach the server.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          # :latest for humans, :<sha> so every deploy stays pullable for rollback.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          target: prod
          # EC2 Graviton (t4g) is arm64; build both so either instance family works.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Ship the compose file + Caddyfile so the server needs no git checkout.
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile
          target: /srv/nikkocomidoy

      # Pinned to a commit SHA — this step runs arbitrary shell on prod.
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd /srv/nikkocomidoy
            # Compose reads `${GITHUB_REPOSITORY}` from the shell env, not
            # `env_file:`. `--env-file deploy/.env.prod` is required on every
            # compose call — auto-`.env` discovery only loads `.env`.
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export IMAGE_TAG="${{ github.sha }}"
            DC="docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml"
            # Server-side docker login for the private ghcr image.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            $DC pull
            # Static files live in S3 — upload them with the real credentials.
            $DC run --rm web python manage.py collectstatic --noinput
            $DC run --rm web python manage.py migrate --noinput
            $DC up -d --remove-orphans
            # Wait for the container healthcheck to flip to "healthy".
            status=starting
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' $($DC ps -q web) 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 2
            done
            [ "$status" = "healthy" ] || { echo "web never became healthy"; $DC logs --tail 100 web; exit 1; }
            # Prune only after a healthy deploy — keeps the previous image for rollback.
            docker image prune -f

      - name: Smoke-test the public site
        run: |
          for i in $(seq 1 10); do
            curl -fsS "https://${{ vars.SITE_DOMAIN }}/readyz" && exit 0
            sleep 3
          done
          exit 1
