{% load allauth %}
<section class="card border-base-300 bg-base-100 border">
  <div class="card-body gap-4">
    <h2 class="card-title">{% slot title %}{% endslot %}</h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
      <div class="card-actions">
        {% for action in slots.actions %}{{ action }}{% endfor %}
      </div>
    {% endif %}
  </div>
</section>
